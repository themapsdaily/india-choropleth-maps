[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "indiamaps"
version = "0.1.0"
description = "Turn a table of regions and values into choropleth maps, colour bars, ranked bar charts and social cards."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "TheMapsDaily", email = "themapsdaily@gmail.com" }]
dependencies = [
  "geopandas>=1.2",
  "matplotlib>=3.11",
  "pandas>=3.1",
  "numpy>=2.5",
  "palettable>=3.3.3",
  "pillow>=13.0",
]

[project.optional-dependencies]
app = ["streamlit>=1.67"]
dev = ["pytest>=9.2", "nbformat>=5.11", "nbconvert>=7.17", "ipykernel>=7.4"]

[project.urls]
Homepage = "https://themapsdaily.com"
Repository = "https://github.com/themapsdaily/india-choropleth-maps"

[tool.setuptools.packages.find]
include = ["indiamaps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
