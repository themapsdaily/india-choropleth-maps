[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "indiamaps"
version = "0.1.0"
description = "Turn a table of regions and values into choropleth maps, colour bars, ranked bar charts and social cards."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "TheMapsDaily", email = "themapsdaily@gmail.com" }]
dependencies = [
  "geopandas>=0.14",
  "matplotlib>=3.7",
  "pandas>=1.5",
  "numpy>=1.23",
  "palettable>=3.3",
  "pillow>=9.5",
]

[project.optional-dependencies]
app = ["streamlit>=1.30"]
dev = ["pytest", "nbformat", "nbconvert", "ipykernel"]

[project.urls]
Homepage = "https://themapsdaily.com"
Repository = "https://github.com/themapsdaily/india-choropleth-maps"

[tool.setuptools.packages.find]
include = ["indiamaps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
